name: aurumcore-bank
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres_local_dev
      POSTGRES_DB: aurumcore
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - aurumcore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurumcore"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  aurumcore_db:
